  <text x="100" y="175" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" fill="#168a52">Full-stack product engineer</text>
  <text x="100" y="225" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#40564a">Business platforms  •  AI &amp; data systems  •  Offline-first products</text>
