  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)" opacity="0.65"/>
  <rect x="58" y="58" width="10" height="204" rx="5" fill="#168a52"/>
  <circle cx="1080" cy="74" r="112" fill="#d9f7e7" opacity="0.85"/>
  <circle cx="1110" cy="42" r="58" fill="#a9e9c8" opacity="0.7"/>
